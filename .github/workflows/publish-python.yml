name: Publish Python

on:
    push:
        tags:
            - "shacl-py-v*"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build-wheels:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64
                    - os: ubuntu-latest
                      target: aarch64
                    - os: macos-latest
                      target: universal2-apple-darwin
                    - os: windows-latest
                      target: x64
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Build wheel
              uses: PyO3/maturin-action@v1
              with:
                  target: ${{ matrix.target }}
                  args: --release --out dist --manifest-path crates/shacl-py/Cargo.toml
                  manylinux: auto

            - name: Smoke test wheel (native targets)
              if: matrix.target == 'x86_64' || matrix.target == 'x64'
              shell: bash
              run: |
                  python -m pip install --no-index --find-links dist shacl-rust
                  python -c "
                  import shacl_rust
                  shapes = '''
                  @prefix ex: <http://example.org/> .
                  @prefix sh: <http://www.w3.org/ns/shacl#> .
                  ex:S a sh:NodeShape ; sh:targetClass ex:P ;
                      sh:property [ sh:path ex:age ; sh:minInclusive 0 ; ] .
                  '''
                  bad = '''
                  @prefix ex: <http://example.org/> .
                  @prefix xsd: <http://www.w3.org/2001/XMLSchema#> .
                  ex:a a ex:P ; ex:age \"-1\"^^xsd:integer .
                  '''
                  assert shacl_rust.conforms(bad, shapes) is False
                  assert shacl_rust.validate(bad, shapes, experimental_index=True)['conforms'] is False
                  print('wheel smoke test ok, version', shacl_rust.__version__)
                  "

            - uses: actions/upload-artifact@v4
              with:
                  name: wheels-${{ matrix.os }}-${{ matrix.target }}
                  path: dist

    build-sdist:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Build sdist
              uses: PyO3/maturin-action@v1
              with:
                  command: sdist
                  args: --out dist --manifest-path crates/shacl-py/Cargo.toml

            - uses: actions/upload-artifact@v4
              with:
                  name: wheels-sdist
                  path: dist

    publish:
        needs: [build-wheels, build-sdist]
        runs-on: ubuntu-latest
        # Publishing requires the PYPI_API_TOKEN repository secret.
        steps:
            - uses: actions/download-artifact@v4
              with:
                  pattern: wheels-*
                  merge-multiple: true
                  path: dist

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  password: ${{ secrets.PYPI_API_TOKEN }}
                  packages-dir: dist
                  skip-existing: true
