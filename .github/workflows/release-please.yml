name: Release Please

on:
    push:
        branches:
            - main
        paths:
            - "crates/**"
            - "src/**"
            - "Cargo.toml"
            - ".github/release-please-config.json"

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        if: github.actor != 'github-actions[bot]'
        outputs:
            releases_created: ${{ steps.release.outputs.releases_created }}

        steps:
            - name: Run release-please
              id: release
              uses: googleapis/release-please-action@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  config-file: .github/release-please-config.json
                  manifest-file: .github/.release-please-manifest.json
                  target-branch: main

    publish-crates:
        needs: release-please
        if: ${{ needs.release-please.outputs.releases_created == 'true' }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Rust
              uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  toolchain: stable

            # --allow-dirty: release-please's own Cargo.lock regeneration isn't always
            # byte-identical to what `cargo publish`'s fresh dependency resolution
            # produces at publish time, which cargo otherwise treats as a dirty
            # working tree and refuses to package. We've already verified the release
            # commit itself passes fmt/clippy/tests, so this is safe here.
            #
            # No `|| echo` masking: a real failure must fail the job loudly. The only
            # case we treat as success-not-failure is "this exact version is already
            # published" (idempotent re-runs after a partial failure), detected from
            # cargo's own error text rather than swallowing every possible error.
            - name: Publish shacl-rust (main crate)
              run: |
                  set -o pipefail
                  if ! cargo publish --package shacl-rust --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --allow-dirty 2>&1 | tee /tmp/publish-shacl-rust.log; then
                      grep -qi "already exists\|already uploaded" /tmp/publish-shacl-rust.log || exit 1
                      echo "shacl-rust: version already published, treating as success"
                  fi

            # Wait for crates.io index to update
            - name: Wait for crates.io index update
              run: sleep 45

            - name: Publish shacl-cli
              run: |
                  set -o pipefail
                  if ! cargo publish --package shacl-cli --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --allow-dirty 2>&1 | tee /tmp/publish-shacl-cli.log; then
                      grep -qi "already exists\|already uploaded" /tmp/publish-shacl-cli.log || exit 1
                      echo "shacl-cli: version already published, treating as success"
                  fi

            - name: Publish shacl-mcp
              run: |
                  set -o pipefail
                  if ! cargo publish --package shacl-mcp --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --allow-dirty 2>&1 | tee /tmp/publish-shacl-mcp.log; then
                      grep -qi "already exists\|already uploaded" /tmp/publish-shacl-mcp.log || exit 1
                      echo "shacl-mcp: version already published, treating as success"
                  fi
