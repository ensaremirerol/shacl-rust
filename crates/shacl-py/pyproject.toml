[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "shacl-rust"
description = "SHACL (Shapes Constraint Language) validator for RDF graphs, powered by Rust"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ensar Emir EROL" }]
requires-python = ">=3.9"
keywords = ["shacl", "rdf", "validation", "semantic-web"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/ensaremirerol/shacl-rust"

[tool.maturin]
features = ["pyo3/extension-module"]
