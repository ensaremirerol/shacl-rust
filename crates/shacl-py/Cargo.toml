[package]
name = "shacl-py"
version = "0.2.10"
edition = "2021"
authors = ["Ensar Emir EROL"]
description = "Python bindings for shacl-rust, a SHACL validator for RDF graphs"
license = "MIT"
repository = "https://github.com/ensaremirerol/shacl-rust"
# Distributed via PyPI (maturin), not crates.io.
publish = false

[lib]
name = "shacl_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
shacl-rust-core = { package = "shacl-rust", version = "0.2.3", path = "../.." }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
serde_json = "1.0"
oxigraph = { version = "0.5.5", default-features = false, features = [] }
